<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Fenice Holding SA</title>
<meta name="robots" content="noindex,follow" />
<meta name="theme-color" content="#0e0e0e" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 120% at 80% 0%, #1a1a1a 0%, #0e0e0e 55%);
    color: #fbfaf7;
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 2rem;
    min-height: 100vh;
  }
  .wrap { max-width: 30rem; }
  .logo { width: 96px; height: auto; margin: 0 auto 2.5rem; display: block; }
  .code {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4rem, 18vw, 7rem);
    font-weight: 400; line-height: 1; letter-spacing: -0.02em;
    color: #DA3233;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500; font-size: clamp(1.5rem, 6vw, 2rem);
    margin: 0.75rem 0 1rem; letter-spacing: -0.01em;
  }
  p {
    color: rgba(251, 250, 247, 0.66);
    font-size: 1rem; line-height: 1.65; margin-bottom: 2.25rem;
  }
  a.home {
    display: inline-block;
    font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase;
    font-weight: 500; color: #fbfaf7; text-decoration: none;
    border: 1px solid rgba(251, 250, 247, 0.3);
    padding: 0.85rem 1.6rem; border-radius: 2px;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
  }
  a.home:hover {
    border-color: #DA3233; color: #fff; background: rgba(218, 50, 51, 0.12);
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/fenice-logo-white.png" alt="Fenice Holding SA" />
    <div class="code">404</div>
    <h1>Pagina non trovata</h1>
    <p>La pagina che cerchi non esiste o è stata spostata.<br><span style="opacity:.8">The page you’re looking for doesn’t exist or has moved.</span></p>
    <a class="home" href="/">Torna alla home · Home</a>
  </div>
</body>
